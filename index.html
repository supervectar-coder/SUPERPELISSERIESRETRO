<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUPERVECTAR PELIS RETRO</title>
<style>
:root{
  --bg:#071025;
  --card:#0b1220;
  --muted:#9aa4b2;
  --highlight:#ffeb3b;
  --font-size:16px;
}
body{
  font-family:Inter,system-ui;
  background:linear-gradient(180deg,#041025 0%,var(--bg) 100%);
  color:#eef2f7;
  margin:0;
  padding:16px;
  font-size: var(--font-size);
  overflow-x:hidden;
}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
h1{font-size:20px;margin:0;color:var(--highlight);font-weight:900;text-shadow:0 0 6px rgba(255,255,0,0.5);} 
input[type=search]{
  padding:12px 16px;
  border-radius:10px;
  border:1px solid rgba(0,0,0,0.4);
  background:var(--highlight);
  color:#000;
  font-weight:bold;
  font-size:16px;
}
h2{margin-top:24px;color:#ffeb3b;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.card{
  cursor:pointer;
  border-radius:8px;
  overflow:hidden;
  outline:none;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover, .card:focus{
  transform: scale(1.05);
  box-shadow:0 8px 20px rgba(255,235,59,0.6);
}
.card .img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:8px;
}
.card .title{font-weight:700;font-size:14px;margin-top:4px;}
.card .meta{color:var(--muted);font-size:12px;margin-top:2px;}
.pagination{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:12px;
}
.pagination button{
  padding:10px 14px;
  border-radius:6px;
  border:1px solid #fff;
  background:transparent;
  color:#fff;
  cursor:pointer;
  font-size:14px;
}
.pagination button.active{
  background:var(--highlight);
  color:#000;
}
.pagination button:hover,
.pagination button:focus{
  background:var(--highlight);
  color:#000;
  outline:none;
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="https://i.ibb.co/HpTQSGB3/cineseries.png"
         style="height:42px;width:42px;border-radius:50%;object-fit:cover;">
    <div><h1>SUPERVECTAR PELIS RETRO</h1></div>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <input id="search" type="search" placeholder="Buscar..." tabindex="0">

    <!-- ✅ Selector de año con fondo amarillo -->
    <select id="filterYear"
            style="width:100px; background:var(--highlight); color:#000; font-weight:bold;"
            tabindex="0">
      <option value="">Año</option>
    </select>
  </div>
</header>

<main>
  <h2>Películas</h2>
  <div id="movies-grid" class="grid"></div>
  <div id="movies-pagination" class="pagination"></div>
</main>

<script>
const mediaData = [
  { id:'makinavaja', title:'Makinavaja "El ultimo choriso"', year:1992, genre:'Cine Español', poster:'https://i.postimg.cc/QN4z2yGJ/IMG-20241123-103144-610.jpg', link:'https://filemoon.to/d/tm8a89v1cb5m/Makinavaja_El_ultimo_Chorizo_1992_mp4.mp4'},
  { id:'semospeligrosos', title:'Semos peligrosos "Makinavaja 2"', year:1993, genre:'Cine Español', poster:'https://i.postimg.cc/Y0QB2Nwx/IMG-20241123-104214-440.jpg', link:'https://filemoon.to/d/lzza394opopo/SEMOS_PELIGROSOS_1993_mp4.mp4'},
  { id:'vacio', title:'vacio', year:2025, genre:'Cine Español', poster:'https://i.ibb.co/HpTQSGB3/cineseries.png', link:''}
];

let itemsPerPage = 12;
let moviePage = 1;
let filteredData = mediaData;
let movieFocus = 0;

const searchEl = document.getElementById('search');
const yearEl = document.getElementById('filterYear');

[...new Set(mediaData.map(i=>i.year))].sort((a,b)=>b-a).forEach(y=>{
  const o=document.createElement('option');
  o.value = y;
  o.textContent = y;
  yearEl.appendChild(o);
});

function renderMovies(data){
  const moviesEl = document.getElementById('movies-grid');
  const moviesPagEl = document.getElementById('movies-pagination');

  const movies = data;
  const movieTotalPages = Math.ceil(movies.length/itemsPerPage) || 1;
  if(moviePage > movieTotalPages) moviePage = movieTotalPages;

  const start = (moviePage-1)*itemsPerPage;
  const end = start + itemsPerPage;
  moviesEl.innerHTML = '';

  movies.slice(start,end).forEach(item=>{
    const div=document.createElement('div');
    div.className='card'; 
    div.tabIndex=0;
    div.innerHTML=`
      <img class="img" src="${item.poster}">
      <div class="info">
        <div class="title">${item.title}</div>
        <div class="meta">${item.year} • ${item.genre}</div>
      </div>`;
    div.onclick=()=>window.open(item.link,'_blank');
    moviesEl.appendChild(div);
  });

  moviesPagEl.innerHTML='';
  for(let i=1;i<=movieTotalPages;i++){
    const btn=document.createElement('button'); 
    btn.textContent=i;
    if(i===moviePage) btn.classList.add('active');
    btn.onclick=()=>{ moviePage=i; renderMovies(filteredData); };
    moviesPagEl.appendChild(btn);
  }
}

function applyFilters(){
  const q = searchEl.value.toLowerCase();
  const year = yearEl.value;

  filteredData = mediaData.filter(m=>
    (!year || String(m.year)===year) &&
    m.title.toLowerCase().includes(q)
  );

  moviePage = 1;
  renderMovies(filteredData);
}

searchEl.oninput = yearEl.onchange = applyFilters;

function setFocus(idx){
  let cards = document.querySelectorAll('#movies-grid .card');
  if(cards[idx]) cards[idx].focus();
}

document.addEventListener('keydown', e=>{
  let cards = document.querySelectorAll('#movies-grid .card');
  let focusIdx = movieFocus;

  if(e.key==='ArrowRight'){ focusIdx=(focusIdx+1)%cards.length; setFocus(focusIdx); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ focusIdx=(focusIdx-1+cards.length)%cards.length; setFocus(focusIdx); e.preventDefault(); }
  if(e.key==='Enter'){ cards[focusIdx].click(); e.preventDefault(); }

  movieFocus = focusIdx;
});

renderMovies(mediaData);
</script>

</body>
</html>
